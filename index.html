<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>Todo App</h1>
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="What needs doing?">
            <button id="addBtn">Add</button>
        </div>
        <p class="tip">Tip: double-click a todo to edit. Press Enter to save.</p>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="itemCount">0 items left</span>
            <div class="footer-actions">
                <button id="clearCompletedBtn">Clear completed</button>
                <button id="clearAllBtn">Clear all</button>
            </div>
        </div>
    </div>
    <!-- Hn-link el app.js ely hy-generate mn el typescript -->
    <script src="app.js"></script>
</body>
</html>
